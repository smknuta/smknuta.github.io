<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5; url=https://kurikulum.smknuta.web.id/pro/sites/pembelajaran/index.html">
    <title>Mengalihkan ke Halaman Tujuan...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 50% 30%, #2a5298 0%, #1e3c72 50%, #0f1e3d 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Efek partikel latar belakang */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px),
                radial-gradient(circle, rgba(0,229,255,0.1) 1px, transparent 1px);
            background-size: 60px 60px, 90px 90px;
            background-position: 0 0, 30px 30px;
            animation: starMove 30s linear infinite;
            pointer-events: none;
        }
        @keyframes starMove {
            from { background-position: 0 0, 30px 30px; }
            to   { background-position: 60px 60px, 90px 90px; }
        }

        .wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ========== ANIMASI GIF BESAR ========== */
        .gif-box {
            width: clamp(220px, 40vw, 420px);
            height: clamp(220px, 40vw, 420px);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
            animation: pulse 2.5s ease-in-out infinite;
        }
        .gif-box::after {
            content: "";
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,229,255,0.35) 0%, transparent 70%);
            z-index: -1;
            animation: glow 3s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.05); }
        }
        @keyframes glow {
            from { opacity: 0.4; transform: scale(0.95); }
            to   { opacity: 1;   transform: scale(1.1); }
        }
        .gif-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.7));
        }

        /* ========== JUDUL ========== */
        h1 {
            font-size: clamp(22px, 3.5vw, 38px);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #00e5ff, #00ffa3, #00e5ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }

        p.subtitle {
            font-size: clamp(13px, 1.6vw, 17px);
            opacity: 0.85;
            margin-bottom: 30px;
            max-width: 550px;
            line-height: 1.6;
        }

        /* ========== COUNTDOWN CIRCLE BESAR ========== */
        .countdown-wrapper {
            display: flex;
            align-items: center;
            gap: 35px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .countdown-circle {
            position: relative;
            width: clamp(120px, 18vw, 170px);
            height: clamp(120px, 18vw, 170px);
            flex-shrink: 0;
        }
        .countdown-circle svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        .countdown-circle circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
        }
        .circle-bg {
            stroke: rgba(255, 255, 255, 0.15);
        }
        .circle-progress {
            stroke: #00e5ff;
            stroke-dasharray: 377;
            stroke-dashoffset: 0;
            animation: countdown 5s linear forwards;
            filter: drop-shadow(0 0 10px #00e5ff);
        }
        @keyframes countdown {
            from { stroke-dashoffset: 0; }
            to   { stroke-dashoffset: 377; }
        }
        .countdown-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(42px, 6vw, 68px);
            font-weight: 800;
            color: #00e5ff;
            text-shadow: 0 0 25px rgba(0, 229, 255, 0.9);
            animation: numberPop 1s ease-in-out infinite;
        }
        @keyframes numberPop {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%      { transform: translate(-50%, -50%) scale(1.12); }
        }

        /* ========== PROGRESS BAR ========== */
        .progress-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e5ff, #00ffa3);
            border-radius: 10px;
            animation: progress 5s linear forwards;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.8);
        }
        @keyframes progress {
            from { width: 0%; }
            to   { width: 100%; }
        }

        /* ========== LINK MANUAL ========== */
        .link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 12px 26px;
            color: #00e5ff;
            text-decoration: none;
            font-size: clamp(13px, 1.4vw, 15px);
            font-weight: 600;
            border: 2px solid rgba(0, 229, 255, 0.6);
            border-radius: 50px;
            background: rgba(0, 229, 255, 0.08);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        .link:hover {
            background: rgba(0, 229, 255, 0.2);
            border-color: #00ffa3;
            color: #00ffa3;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.4);
        }

        /* ========== FOOTER ========== */
        .footer {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            opacity: 0.6;
            letter-spacing: 1px;
            z-index: 2;
        }

        /* ========== RESPONSIF HP ========== */
        @media (max-width: 600px) {
            .gif-box {
                width: 60vw;
                height: 60vw;
                max-width: 260px;
                max-height: 260px;
                margin-bottom: 15px;
            }
            .countdown-wrapper {
                gap: 20px;
                margin-bottom: 20px;
            }
            p.subtitle { margin-bottom: 20px; }
        }

        @media (max-height: 700px) {
            .gif-box {
                width: 40vh;
                height: 40vh;
                margin-bottom: 15px;
            }
            h1 { font-size: 22px; margin-bottom: 8px; }
            p.subtitle { margin-bottom: 15px; }
            .countdown-wrapper { margin-bottom: 15px; gap: 20px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <!-- ===== ANIMASI GIF BESAR ===== -->
        <div class="gif-box">
            <img src="animasi.gif" alt="Loading...">
        </div>

        <h1>Mengalihkan Halaman</h1>
        <p class="subtitle">Anda akan diarahkan ke halaman tujuan dalam beberapa detik. Mohon tunggu sebentar...</p>

        <div class="countdown-wrapper">
            <div class="countdown-circle">
                <svg viewBox="0 0 130 130">
                    <circle class="circle-bg" cx="65" cy="65" r="60"></circle>
                    <circle class="circle-progress" cx="65" cy="65" r="60"></circle>
                </svg>
                <div class="countdown-number" id="countdown">5</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-label">
                <span>Memuat Halaman</span>
                <span id="percent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <a class="link" href="https://kurikulum.smknuta.web.id/pro/sites/pembelajaran/index.html">
            Buka Sekarang →
        </a>
    </div>

    <div class="footer">SMK Nusantara Utama &copy; 2025</div>

    <script>
        // Hitung mundur angka
        let counter = 5;
        const countdownEl = document.getElementById("countdown");
        const percentEl = document.getElementById("percent");
        let percent = 0;

        const timer = setInterval(() => {
            counter--;
            if (counter >= 0) {
                countdownEl.textContent = counter;
            }
        }, 1000);

        // Update persentase progress
        const percentTimer = setInterval(() => {
            percent += 2;
            if (percent <= 100) {
                percentEl.textContent = percent + "%";
            } else {
                clearInterval(percentTimer);
            }
        }, 100); // 100ms × 100 = 10 detik? Sesuaikan
        // Perbaikan: 5 detik / 100 langkah = 50ms
        clearInterval(percentTimer);
        percent = 0;
        const percentTimer2 = setInterval(() => {
            percent += 1;
            if (percent <= 100) {
                percentEl.textContent = percent + "%";
            } else {
                clearInterval(percentTimer2);
            }
        }, 50);

        // Redirect setelah 5 detik
        setTimeout(() => {
            clearInterval(timer);
            clearInterval(percentTimer2);
            window.location.href = "https://kurikulum.smknuta.web.id/pro/sites/pembelajaran/index.html";
        }, 5000);
    </script>
</body>
</html>
